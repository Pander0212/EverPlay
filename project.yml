name: EverPlay
options:
  minimumXcodeGenVersion: 2.44.1
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
packages:
  EverPlay:
    path: .
targets:
  EverPlay:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - Resources
          - Info.plist
      - path: App/Resources
        buildPhase: resources
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: EverPlay
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # Documents (games, saves) visible in Files under On My iPhone › EverPlay.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        NSFaceIDUsageDescription: EverPlay can lock your library with Face ID.
        # Mouse and trackpad input for games.
        UIApplicationSupportsIndirectInputEvents: true
        # Offered in "Open in…" / Share for ZIP archives (Files, Safari downloads).
        CFBundleDocumentTypes:
          - CFBundleTypeName: Game archive
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.zip-archive
              - com.pkware.zip-archive
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.everplay.player
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # The all-in-one build links MetalANGLE directly (see allinone.yml) so OpenGL ES lookups
        # of the embedded Ren'Py runtimes reach it first; empty for every other build.
        FRAMEWORK_SEARCH_PATHS: "$(inherited) $(EVERPLAY_EXTRA_FRAMEWORK_PATHS)"
        OTHER_LDFLAGS: "$(inherited) $(EVERPLAY_EXTRA_LDFLAGS)"
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        GENERATE_INFOPLIST_FILE: NO
    dependencies:
      - package: EverPlay
        product: EverPlayCore
  EverPlayAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: AppUnitTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.everplay.player.tests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: EverPlay
      - package: EverPlay
        product: EverPlayCore
  EverPlayUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: AppTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.everplay.player.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: EverPlay
    dependencies:
      - target: EverPlay
schemes:
  EverPlay:
    build:
      targets:
        EverPlay: all
        EverPlayUITests: [test]
        EverPlayAppTests: [test]
    test:
      targets:
        - EverPlayUITests
        - EverPlayAppTests
      gatherCoverageData: true
