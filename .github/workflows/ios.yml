name: iOS Simulator
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  simulator:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Reuse the pinned XcodeGen source build
        id: xcodegen-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: .build-tools/XcodeGen
          key: ${{ runner.os }}-${{ runner.arch }}-xcode16.4-xcodegen-21ac9944b0ab546a07422dbed86f33dd2ebd76f8-v1
      - name: Resolve, compile and test Swift core and iOS application
        run: bash scripts/test-ios.sh
      - name: Check whether the generator completed
        if: always()
        id: generator
        run: |
          if [[ -x .build-tools/XcodeGen/.build/release/xcodegen ]]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Preserve the generator even if an application test failed
        if: always() && steps.generator.outputs.ready == 'true' && steps.xcodegen-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: .build-tools/XcodeGen
          key: ${{ steps.xcodegen-cache.outputs.cache-primary-key }}
      - name: Upload logs and current simulator test results
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ios-simulator-results
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14
      - name: Upload unsigned simulator application (not an iPhone IPA)
        if: success()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: EverPlay-simulator-app
          path: DerivedData/Build/Products/Debug-iphonesimulator/EverPlay.app
          retention-days: 14
