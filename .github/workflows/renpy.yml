name: RenPy desktop-data experiment
on:
  workflow_dispatch:
    inputs:
      runtime:
        description: 'Pinned runtime for our original fixture (never a third-party game upload)'
        type: choice
        default: '8.5.3'
        options:
          - '8.5.3'
          - '8.2.0'
permissions:
  contents: read
concurrency:
  group: renpy-${{ github.ref }}
  cancel-in-progress: true
jobs:
  desktop-data-in-everplay:
    runs-on: macos-15-intel
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Reuse the pinned XcodeGen source build
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: .build-tools/XcodeGen
          key: ${{ runner.os }}-${{ runner.arch }}-xcode16.4-xcodegen-21ac9944b0ab546a07422dbed86f33dd2ebd76f8-v1
      - name: Reuse verified RenPy SDK and web runtime
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            .build-tools/renpy
            .build-tools/renpy-8.2
          key: renpy-${{ inputs.runtime }}-${{ runner.os }}-${{ runner.arch }}-v2
      - name: Build original desktop package and convert its compiled archive
        env:
          PROBE_RUNTIME: ${{ inputs.runtime }}
        run: |
          mkdir -p artifacts
          set -o pipefail
          case "$PROBE_RUNTIME" in
            8.5.3) builder=scripts/build-renpy-probe.py ;;
            8.2.0) builder=scripts/build-renpy-820-template.py ;;
            *) echo 'Unsupported probe runtime' >&2; exit 1 ;;
          esac
          if ! python3 "$builder" 2>&1 | tr '\r' '\n' > artifacts/renpy-build.log; then
            tail -n 60 artifacts/renpy-build.log
            exit 1
          fi
          if [[ "$PROBE_RUNTIME" == 8.2.0 ]]; then
            cp artifacts/EverPlayRenPy820Template.zip App/Resources/EverPlayRenPyProbe.zip
            rm artifacts/EverPlayRenPy820Template.zip
          fi
      - name: Run production importer, HTTP server and WebKit with real RenPy
        run: |
          bash scripts/test-ios.sh
          python3 scripts/verify-ios-tests.py artifacts/ios-build-test.log testRenPyDesktopArchiveRunsAndRestoresSaveInWebKit
      - name: Retain test evidence and screenshots
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: renpy-experiment-results
          path: artifacts/
          retention-days: 14
