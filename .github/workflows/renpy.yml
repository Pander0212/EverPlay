name: RenPy desktop-data experiment
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: renpy-${{ github.ref }}
  cancel-in-progress: true
jobs:
  desktop-data-in-everplay:
    runs-on: macos-15-intel
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Reuse verified RenPy downloads and pinned XcodeGen
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            .build-tools/renpy
            .build-tools/XcodeGen
          key: renpy-8.5.3-${{ runner.os }}-${{ runner.arch }}-xcode16.4-xcodegen2.44.1-v1
      - name: Build original desktop package and convert its compiled archive
        run: |
          mkdir -p artifacts
          set -o pipefail
          python3 scripts/build-renpy-probe.py 2>&1 | tr '\r' '\n' > artifacts/renpy-build.log
      - name: Run production importer, HTTP server and WebKit with real RenPy
        run: |
          bash scripts/test-ios.sh
          python3 scripts/verify-ios-tests.py artifacts/ios-build-test.log testRenPyDesktopArchiveRunsAndRestoresSaveInWebKit
      - name: Retain test evidence and screenshots
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: renpy-experiment-results
          path: artifacts/
          retention-days: 14
