name: Godot engine for iPhone
# Builds Godot<NN>.framework (Godot 4, MIT, official sources at a pinned tag, adapted by
# scripts/godot/patch-godot-ios.py) for iPhone and the simulator and publishes it to the
# libretro-cores release, which the all-in-one build pins.
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/godot-ios.yml
      - scripts/godot/**
permissions:
  contents: read
concurrency:
  group: godot-ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-26
    permissions:
      contents: write  # the libretro-cores release
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        version: ['4.7.2']
        kind: [device, simulator]
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Reuse compiled objects
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: .scons-cache
          key: godot-ios-${{ matrix.version }}-${{ matrix.kind }}-v1-${{ hashFiles('scripts/godot/**') }}
          restore-keys: godot-ios-${{ matrix.version }}-${{ matrix.kind }}-v1-
      - name: Build tools
        run: python3 -m pip install --break-system-packages --quiet 'scons==4.9.1'
      - name: Build Godot
        env:
          GODOT_SCONS_EXTRA: cache_path=${{ github.workspace }}/.scons-cache cache_limit=4
        run: |
          set -o pipefail
          mkdir -p build/godot-output
          bash scripts/godot/build-godot-ios.sh "${{ matrix.version }}" "${{ matrix.kind }}" build/godot-output 2>&1 \
            | tee build-godot.log | grep -E 'error|Error|warning: unused|^Godot|\.framework|everplay_godot_|^scons: ' | head -n 300
      - name: Package
        run: |
          set -euo pipefail
          id="$(echo '${{ matrix.version }}' | cut -d. -f1,2 | tr -d .)"
          (cd build/godot-output && zip -qry "$GITHUB_WORKSPACE/godot.framework.zip" "Godot$id.framework")
          ls -la godot.framework.zip
      - name: Publish the framework for the all-in-one build
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          id="$(echo '${{ matrix.version }}' | cut -d. -f1,2 | tr -d .)"
          arch=ios-arm64; [ '${{ matrix.kind }}' = simulator ] && arch=ios-arm64-simulator
          patch="$(cat scripts/godot/* | shasum -a 256 | cut -c1-7)"
          name="Godot${id}_${arch}-${{ matrix.version }}-${patch}.framework.zip"
          # Never replace a published engine: allinone.yml pins its checksum. Changed patches get a new name.
          if gh release view libretro-cores --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' | grep -qx "$name"; then
            echo "$name is already published; kept as it is."
            exit 0
          fi
          cp godot.framework.zip "$name"
          gh release upload libretro-cores --repo "$GITHUB_REPOSITORY" "$name"
          echo "Pin in allinone.yml: $name $(shasum -a 256 "$name" | cut -d' ' -f1)"
      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: godot-ios-${{ matrix.version }}-${{ matrix.kind }}-logs
          path: build-godot.log
          retention-days: 14
