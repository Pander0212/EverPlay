name: WOLF RPG engine for iPhone
# Builds EverPlay's WOLF RPG Editor engine (Engines/WolfRPG) with SDL2 and SDL2_ttf for iPhone
# (scripts/build-wolfrpg-ios.sh), links WolfRPG.framework (scripts/package-wolfrpg-framework.py)
# and publishes it to the libretro-cores release, which the all-in-one build pins.
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/wolfrpg-ios.yml
      - scripts/build-wolfrpg-ios.sh
      - scripts/package-wolfrpg-framework.py
      - Engines/WolfRPG/**
permissions:
  contents: read
concurrency:
  group: wolfrpg-ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    # The engine's data readers and interpreter, on Linux, before the iPhone build.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Build tools
        run: sudo apt-get update -q && sudo apt-get install -y -q ninja-build libsdl2-dev libsdl2-ttf-dev
      - name: Build and test
        run: |
          cmake -S Engines/WolfRPG -B build/wolfrpg-linux -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build/wolfrpg-linux
          ctest --test-dir build/wolfrpg-linux --output-on-failure
  build:
    needs: test
    runs-on: macos-26
    permissions:
      contents: write  # the libretro-cores release, which the all-in-one build pins
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      CCACHE_DIR: ${{ github.workspace }}/.ccache
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Reuse compiled objects
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: .ccache
          key: wolfrpg-ios-v1-${{ github.run_id }}
          restore-keys: wolfrpg-ios-v1-
      - name: Build tools
        run: brew install -q ccache cmake ninja
      - name: Build the engine and its libraries
        run: |
          set -o pipefail
          ccache --set-config=max_size=1G
          bash scripts/build-wolfrpg-ios.sh 2>&1 | tee build-wolfrpg-ios.log
      - name: Link WolfRPG.framework
        run: |
          set -o pipefail
          python3 scripts/package-wolfrpg-framework.py build/wolfrpg-output 2>&1 | tee package-wolfrpg.log
          ls -la build/wolfrpg-output/Frameworks/WolfRPG.framework
          (cd build/wolfrpg-output && zip -qry ../../WolfRPG.framework.zip Frameworks)
      - name: Publish the framework for the all-in-one build
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          name="wolfrpg_ios-arm64-$(git rev-parse --short HEAD).framework.zip"
          # Never replace a published framework: allinone.yml pins its checksum.
          if gh release view libretro-cores --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' | grep -qx "$name"; then
            echo "$name is already published; kept as it is."
            exit 0
          fi
          cp WolfRPG.framework.zip "$name"
          gh release upload libretro-cores --repo "$GITHUB_REPOSITORY" "$name"
          echo "Pin in allinone.yml: $name $(shasum -a 256 "$name" | cut -d' ' -f1)"
      - name: Keep the framework
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: wolfrpg-framework
          path: WolfRPG.framework.zip
          retention-days: 14
      - name: Keep compiled objects
        if: always()
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: .ccache
          key: wolfrpg-ios-v1-${{ github.run_id }}
      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: wolfrpg-ios-logs
          path: |
            build-wolfrpg-ios.log
            package-wolfrpg.log
          retention-days: 14
