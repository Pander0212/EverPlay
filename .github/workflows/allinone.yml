name: EverPlay all-in-one (Ren'Py inside)
# One app instead of plugin apps: every Ren'Py runtime becomes a framework inside EverPlay.
# Our MIT fixtures only. The simulator job starts one fixture per runtime from EverPlay's own
# library; the IPA job produces the unsigned all-in-one test build.
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/allinone.yml
      - scripts/build-renpy-ios-prototype.py
      - scripts/package-renpy-runtime.py
      - scripts/renpy-common/**
      - Sources/**
      - App/**
      - project.yml
permissions:
  contents: read
concurrency:
  group: allinone-${{ github.ref }}
  cancel-in-progress: true
env:
  # 8.5.3 first: it provides the MetalANGLE every runtime shares.
  RUNTIMES: '8.5.3 8.4.1 8.3.7 8.2.3 8.1.3 7.8.7'
jobs:
  simulator:
    runs-on: macos-15-intel
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Reuse Ren'Py 8.5.3 downloads
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: .build-tools/renpy-8.5
          key: renpy-8.5.3-renios-${{ runner.os }}-${{ runner.arch }}-v1
      - name: Reuse Ren'Py 8.4.1 downloads
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: .build-tools/renpy-8.4
          key: renpy-8.4.1-renios-${{ runner.os }}-${{ runner.arch }}-v1
      - name: Reuse Ren'Py 8.3.7 downloads
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: .build-tools/renpy-8.3
          key: renpy-8.3.7-renios-${{ runner.os }}-${{ runner.arch }}-v1
      - name: Reuse Ren'Py 8.2.3 downloads
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: .build-tools/renpy-8.2
          key: renpy-8.2.3-renios-${{ runner.os }}-${{ runner.arch }}-v1
      - name: Reuse Ren'Py 8.1.3 downloads
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: .build-tools/renpy-8.1
          key: renpy-8.1.3-renios-${{ runner.os }}-${{ runner.arch }}-v1
      - name: Reuse Ren'Py 7.8.7 downloads
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: .build-tools/renpy-7.8
          key: renpy-7.8.7-renios-${{ runner.os }}-${{ runner.arch }}-v1
      - name: Reuse the pinned XcodeGen source build
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: .build-tools/XcodeGen
          key: ${{ runner.os }}-${{ runner.arch }}-xcode16.4-xcodegen-21ac9944b0ab546a07422dbed86f33dd2ebd76f8-v1
      - name: Package the Ren'Py runtimes for the simulator
        run: |
          set -euo pipefail
          mkdir -p artifacts build/fixtures
          for runtime in $RUNTIMES; do
            id="$(echo "$runtime" | cut -d. -f1,2 | tr -d .)"
            EVERPLAY_RENPY_RUNTIME="$runtime" python3 scripts/build-renpy-ios-prototype.py > "artifacts/prototype-$id.log" 2>&1 \
              || { tail -n 60 "artifacts/prototype-$id.log"; exit 1; }
            EVERPLAY_RENPY_RUNTIME="$runtime" python3 scripts/package-renpy-runtime.py iphonesimulator build/runtimes \
              > "artifacts/package-$id.log" 2>&1 || { tail -n 60 "artifacts/package-$id.log"; exit 1; }
            cp -R build/renpy-ios/variant "build/fixtures/Probe$id"
            cp -R build/renpy-ios/engine "build/fixtures/Engine$id"
          done
          # Asks for a name before the main menu; the screenshot shows the keyboard or EverPlay's Type button.
          cp -R build/fixtures/Probe85 build/fixtures/Input85
          printf 'label splashscreen:\n    $ typed_name = renpy.input("What is your name?", default="Probe")\n    return\n' \
            > build/fixtures/Input85/game/zz_input.rpy
          # Opens EverPlay's variable editor after 20 s; the screenshot should list gold = 37.
          cp -R build/fixtures/Probe78 build/fixtures/Menu78
          printf 'init 2000 python:\n    config.overlay_screens.append("zz_menu_test")\nscreen zz_menu_test():\n    timer 20.0 action Show("_everplay_cheats")\n' \
            > build/fixtures/Menu78/game/zz_menu.rpy
          # Python 2 opens a link the way desktop games do; EverPlay-log.txt should record it (runtime bridge).
          cp -R build/fixtures/Probe78 build/fixtures/Link78
          printf 'label splashscreen:\n    $ import os\n    $ os.system("start https://example.com/everplay-link-test")\n    return\n' \
            > build/fixtures/Link78/game/zz_link.rpy
          # A full-screen button that writes every tap to clicks.txt (RenPyResumeUITests).
          cp -R build/fixtures/Probe85 build/fixtures/Resume85
          cat > build/fixtures/Resume85/game/zz_resume.rpy <<'RPY'
          init python:
              import os, time
              def zz_tap():
                  store.zz_taps += 1
                  with open(os.path.join(config.basedir, "clicks.txt"), "a") as f:
                      f.write("tap %d %.1f\n" % (store.zz_taps, time.time()))
          default zz_taps = 0
          screen zz_tap_screen():
              modal True
              button:
                  xfill True
                  yfill True
                  background Solid("#203040")
                  action Function(zz_tap)
                  text "Taps: [zz_taps]" align (0.5, 0.5) size 80
          label splashscreen:
              call screen zz_tap_screen
              return
          RPY
          du -sh build/runtimes/Frameworks/* build/runtimes/Runtimes/*
      - name: Build EverPlay for the simulator and embed the runtimes
        run: |
          set -euo pipefail
          bash scripts/generate-project.sh > artifacts/project-generation.log 2>&1 || { tail -n 60 artifacts/project-generation.log; exit 1; }
          set -o pipefail
          # build-for-testing: also the UI test runner for RenPyResumeUITests.
          xcodebuild build-for-testing -project EverPlay.xcodeproj -scheme EverPlay -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' ARCHS=x86_64 ONLY_ACTIVE_ARCH=NO \
            -derivedDataPath DerivedData -clonedSourcePackagesDirPath .build/xcode-packages CODE_SIGN_IDENTITY=- \
            EVERPLAY_EXTRA_FRAMEWORK_PATHS="$PWD/build/runtimes/Frameworks" EVERPLAY_EXTRA_LDFLAGS="-framework MetalANGLE" \
            2>&1 | tee artifacts/everplay-build.log | grep -E 'error:|\*\* (TEST )?BUILD' || true
          grep -q '\*\* TEST BUILD SUCCEEDED \*\*' artifacts/everplay-build.log
          app=DerivedData/Build/Products/Debug-iphonesimulator/EverPlay.app
          mkdir -p "$app/Frameworks"
          cp -R build/runtimes/Frameworks/. "$app/Frameworks/"
          cp -R build/runtimes/Runtimes "$app/"
          for framework in "$app"/Frameworks/*.framework; do codesign --force --sign - --timestamp=none "$framework"; done
          codesign --force --sign - --timestamp=none "$app"
      - name: Start one fixture per runtime from EverPlay's library
        run: |
          set -euo pipefail
          app=DerivedData/Build/Products/Debug-iphonesimulator/EverPlay.app
          bundle="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Info.plist")"
          udid="$(xcrun simctl list devices available -j | python3 -c '
          import json,sys
          items=json.load(sys.stdin)["devices"]
          print(next(d["udid"] for r,ds in items.items() if "iOS" in r for d in ds if "iPhone" in d["name"]))')"
          python3 -c 'import subprocess,sys; subprocess.run(["xcrun","simctl","bootstatus",sys.argv[1],"-b"],timeout=600,check=True)' "$udid"
          xcrun simctl install "$udid" "$app"
          data="$(xcrun simctl get_app_container "$udid" "$bundle" data)"
          mkdir -p "$data/Documents/Ren'Py"
          cp -R build/fixtures/. "$data/Documents/Ren'Py/"
          # Probe (Gold: 37) per runtime; Engine84 ships its own engine copy (Gold: 99); Input85 waits for text; Menu78 opens the variable editor.
          # A hanging simulator command must not stall the whole job.
          limited() { python3 -c 'import subprocess,sys; sys.exit(subprocess.run(sys.argv[2:], timeout=float(sys.argv[1])).returncode)' "$@"; }
          # A freshly booted simulator keeps migrating data for minutes; wait until it takes a screenshot.
          for attempt in $(seq 1 20); do
            if limited 30 xcrun simctl io "$udid" screenshot artifacts/warmup.png; then break; fi
            sleep 15
          done
          # First, on a fresh app (later fixtures leave dialogs behind): leave Resume85 for the home
          # screen and come back; taps afterwards must still reach the game.
          echo "== Resume85 $(date -u +%T)"
          limited 600 env TEST_RUNNER_EVERPLAY_RESUME_GAME=Resume85 xcodebuild test-without-building \
            -project EverPlay.xcodeproj -scheme EverPlay -destination "platform=iOS Simulator,id=$udid" \
            -derivedDataPath DerivedData -resultBundlePath artifacts/resume.xcresult \
            -only-testing:EverPlayUITests/RenPyResumeUITests > artifacts/resume-test.log 2>&1 \
            || { echo "resume UI test failed or timed out"; tail -n 40 artifacts/resume-test.log; }
          xcrun xcresulttool export attachments --path artifacts/resume.xcresult --output-path artifacts/resume \
            > /dev/null 2>&1 || true
          taps="$(cat "$data/Documents/Ren'Py/Resume85/clicks.txt" 2>/dev/null || true)"
          echo "$taps"
          printf '%s\n' "$taps" > artifacts/resume-taps.txt
          resume_ok=yes
          [ "$(printf '%s\n' "$taps" | grep -c '^tap')" -ge 3 ] || resume_ok=no
          echo "== Resume85: taps after returning reached the game: $resume_ok"
          for game in Probe85 Probe84 Probe83 Probe82 Probe81 Probe78 Engine84 Input85 Menu78 Link78; do
            echo "== $game $(date -u +%T)"
            limited 60 xcrun simctl launch --stdout="$PWD/artifacts/$game-stdout.log" --stderr="$PWD/artifacts/$game-stderr.log" \
              "$udid" "$bundle" -EverPlayAutoplayRenPy "$game" || echo "launch of $game failed or timed out"
            sleep 75
            limited 60 xcrun simctl io "$udid" screenshot "artifacts/$game.png" || echo "screenshot of $game failed or timed out"
            limited 60 xcrun simctl terminate "$udid" "$bundle" || true
            echo "== $game"; grep -hE 'EverPlay|Error|Traceback' "artifacts/$game-stdout.log" "artifacts/$game-stderr.log" | head -n 20 || true
          done
          ls "$data/Documents/Saves" || true
          echo "== EverPlay-log.txt"; cat "$data/Documents/EverPlay-log.txt" || true
          # Crash reports explain an exit while Ren'Py starts inside EverPlay.
          find ~/Library/Logs/DiagnosticReports -name 'EverPlay*' -newer "$app/Info.plist" -exec cp {} artifacts/ \; || true
          for report in artifacts/EverPlay*.ips; do [ -f "$report" ] && head -c 6000 "$report"; done || true
          [ "$resume_ok" = yes ] || { echo "::error::Taps did not reach the Ren'Py game after returning from the home screen"; exit 1; }
      - name: Keep screenshots and logs
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: allinone-simulator
          path: artifacts/
          retention-days: 14

  ipa:
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      contents: write  # the "nightly" pre-release that Feather/AltStore sources point to
    env:
      # Pinned copy in the libretro-cores release (empty: build without RPG Maker 2000/2003).
      EASYRPG_CORE: easyrpg_libretro_ios-arm64-2026-10-23.dylib.zip  # EasyRPG Player 0.8.1.1-git+21@a3fbb7c
      EASYRPG_CORE_SHA256: 8e9e3aa210580f4f4874a752807a9daebff40e3e0457f45d3cb751aa6e42d2af
      # OnscripterYuri's web build for ONScripter games (empty: build without ONScripter).
      ONSYURI_WEB: ""
      ONSYURI_WEB_SHA256: ""
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Reuse Ren'Py 8.5.3 downloads
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: .build-tools/renpy-8.5
          key: renpy-8.5.3-renios-${{ runner.os }}-${{ runner.arch }}-v1
      - name: Reuse Ren'Py 8.4.1 downloads
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: .build-tools/renpy-8.4
          key: renpy-8.4.1-renios-${{ runner.os }}-${{ runner.arch }}-v1
      - name: Reuse Ren'Py 8.3.7 downloads
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: .build-tools/renpy-8.3
          key: renpy-8.3.7-renios-${{ runner.os }}-${{ runner.arch }}-v1
      - name: Reuse Ren'Py 8.2.3 downloads
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: .build-tools/renpy-8.2
          key: renpy-8.2.3-renios-${{ runner.os }}-${{ runner.arch }}-v1
      - name: Reuse Ren'Py 8.1.3 downloads
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: .build-tools/renpy-8.1
          key: renpy-8.1.3-renios-${{ runner.os }}-${{ runner.arch }}-v1
      - name: Reuse Ren'Py 7.8.7 downloads
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: .build-tools/renpy-7.8
          key: renpy-7.8.7-renios-${{ runner.os }}-${{ runner.arch }}-v1
      - name: Reuse the pinned XcodeGen source build
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: .build-tools/XcodeGen
          key: ${{ runner.os }}-${{ runner.arch }}-xcode26.6-xcodegen-21ac9944b0ab546a07422dbed86f33dd2ebd76f8-v1
      - name: Package the Ren'Py runtimes for iPhone
        run: |
          set -euo pipefail
          mkdir -p artifacts
          for runtime in $RUNTIMES; do
            id="$(echo "$runtime" | cut -d. -f1,2 | tr -d .)"
            EVERPLAY_RENPY_RUNTIME="$runtime" python3 scripts/build-renpy-ios-prototype.py > "artifacts/prototype-$id.log" 2>&1 \
              || { tail -n 60 "artifacts/prototype-$id.log"; exit 1; }
            EVERPLAY_RENPY_RUNTIME="$runtime" python3 scripts/package-renpy-runtime.py iphoneos build/runtimes \
              > "artifacts/package-$id.log" 2>&1 || { tail -n 60 "artifacts/package-$id.log"; exit 1; }
          done
      - name: Build EverPlay for iPhone and embed the runtimes
        run: |
          set -euo pipefail
          bash scripts/generate-project.sh > artifacts/project-generation.log 2>&1 || { tail -n 60 artifacts/project-generation.log; exit 1; }
          set -o pipefail
          xcodebuild build -project EverPlay.xcodeproj -scheme EverPlay -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath DerivedData \
            -clonedSourcePackagesDirPath .build/xcode-packages \
            EVERPLAY_EXTRA_FRAMEWORK_PATHS="$PWD/build/runtimes/Frameworks" EVERPLAY_EXTRA_LDFLAGS="-framework MetalANGLE" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY= DEVELOPMENT_TEAM= \
            MARKETING_VERSION="0.2.${{ github.run_number }}" CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            2>&1 | tee artifacts/everplay-build.log | grep -E 'error:|\*\* BUILD' || true
          grep -q '\*\* BUILD SUCCEEDED \*\*' artifacts/everplay-build.log
          app=DerivedData/Build/Products/Release-iphoneos/EverPlay.app
          mkdir -p "$app/Frameworks"
          cp -R build/runtimes/Frameworks/. "$app/Frameworks/"
          cp -R build/runtimes/Runtimes "$app/"
          # RPG Maker 2000/2003: the EasyRPG Player libretro core (GPL-3.0), vendored by vendor-cores.yml.
          if [[ -n "$EASYRPG_CORE" ]]; then
            curl --fail --location --show-error --retry 2 --max-time 300 \
              "https://github.com/${GITHUB_REPOSITORY}/releases/download/libretro-cores/$EASYRPG_CORE" --output easyrpg.zip
            echo "$EASYRPG_CORE_SHA256  easyrpg.zip" | shasum -a 256 -c -
            core="$app/Frameworks/easyrpg_libretro.framework"
            mkdir -p "$core"
            unzip -p easyrpg.zip easyrpg_libretro.dylib > "$core/easyrpg_libretro"
            chmod 755 "$core/easyrpg_libretro"
            install_name_tool -id @rpath/easyrpg_libretro.framework/easyrpg_libretro "$core/easyrpg_libretro"
            python3 -c 'import plistlib,sys; plistlib.dump({"CFBundleExecutable": "easyrpg_libretro", "CFBundleIdentifier": "app.everplay.core.easyrpg", "CFBundleName": "easyrpg_libretro", "CFBundlePackageType": "FMWK", "CFBundleShortVersionString": "0.8.1", "CFBundleVersion": "1", "MinimumOSVersion": "17.0", "CFBundleSupportedPlatforms": ["iPhoneOS"]}, open(sys.argv[1], "wb"))' "$core/Info.plist"
          fi
          # ONScripter: OnscripterYuri's WebAssembly build (GPL-2.0), vendored by vendor-cores.yml.
          if [[ -n "$ONSYURI_WEB" ]]; then
            curl --fail --location --show-error --retry 2 --max-time 300 \
              "https://github.com/${GITHUB_REPOSITORY}/releases/download/libretro-cores/$ONSYURI_WEB" --output onsyuri.zip
            echo "$ONSYURI_WEB_SHA256  onsyuri.zip" | shasum -a 256 -c -
            mkdir -p "$app/ONScripter"
            unzip -o -q onsyuri.zip onsyuri.html onsyuri.js onsyuri.wasm -d "$app/ONScripter"
          fi
          # Ad-hoc placeholder signatures; sideloading tools re-sign every framework and the app.
          for framework in "$app"/Frameworks/*.framework; do codesign --force --sign - --timestamp=none "$framework"; done
          codesign --force --sign - --timestamp=none "$app"
          codesign --verify --deep --verbose=2 "$app"
          mkdir -p ipa/Payload
          cp -R "$app" ipa/Payload/
          (cd ipa && zip -qry ../artifacts/EverPlay-AllInOne-unsigned.ipa Payload)
          ls -la artifacts/*.ipa
      - name: Publish the nightly build and the Feather/AltStore source
        # Contains only EverPlay, the Ren'Py runtimes and our MIT demo; never third-party games.
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: 0.2.${{ github.run_number }}
        run: |
          set -euo pipefail
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/nightly"
          cp artifacts/EverPlay-AllInOne-unsigned.ipa release-EverPlay.ipa
          cp App/Resources/Assets.xcassets/AppIcon.appiconset/AppIcon.png release-icon.png
          python3 - "$base" "$VERSION" <<'PYTHON'
          import json, os, sys, datetime
          base, version = sys.argv[1], sys.argv[2]
          size = os.path.getsize('release-EverPlay.ipa')
          date = datetime.datetime.now(datetime.timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ')
          app = {
              'name': 'EverPlay', 'bundleIdentifier': 'app.everplay.player', 'developerName': 'EverPlay',
              'subtitle': 'Play desktop Ren\'Py, RPG Maker and HTML games', 'iconURL': f'{base}/release-icon.png',
              'localizedDescription': 'Nightly test build of EverPlay with built-in Ren\'Py 8.5, 8.4 and 7.8.',
              'tintColor': '8F87ED', 'version': version, 'versionDate': date,
              'downloadURL': f'{base}/release-EverPlay.ipa', 'size': size,
              'versions': [{'version': version, 'date': date, 'downloadURL': f'{base}/release-EverPlay.ipa', 'size': size}],
          }
          source = {'name': 'EverPlay Nightly', 'identifier': 'app.everplay.nightly', 'apps': [app], 'news': []}
          json.dump(source, open('release-source.json', 'w'), indent=2)
          PYTHON
          gh release delete nightly --yes --cleanup-tag || true
          # The releases API sometimes answers 403/5xx for a moment; the source must not stay empty.
          for attempt in 1 2 3 4; do
            if gh release create nightly --prerelease --target "$GITHUB_SHA" --title "EverPlay nightly $VERSION" \
                 --notes "Unsigned test build from $GITHUB_SHA. Feather/AltStore source: $base/release-source.json" \
                 release-EverPlay.ipa release-icon.png release-source.json; then
              exit 0
            fi
            gh release delete nightly --yes --cleanup-tag || true
            sleep $((attempt * 15))
          done
          exit 1
      - name: Keep the IPA
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: EverPlay-AllInOne-unsigned-ipa
          path: artifacts/
          retention-days: 30
