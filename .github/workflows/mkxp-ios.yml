name: mkxp-z for iPhone (RPG Maker XP/VX/VX Ace)
# Builds mkxp-z and its libraries for iPhone with scripts/build-mkxp-ios.sh. Compiled objects
# are kept in a ccache, so a run after a fix only rebuilds what changed.
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/mkxp-ios.yml
      - scripts/build-mkxp-ios.sh
      - scripts/patch-mkxp-ios.py
permissions:
  contents: read
concurrency:
  group: mkxp-ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 150
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      CCACHE_DIR: ${{ github.workspace }}/.ccache
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Reuse compiled objects and downloads
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            .ccache
            build/mkxp-ios/mkxp-z/subprojects/packagecache
          key: mkxp-ios-v2-${{ github.run_id }}
          restore-keys: mkxp-ios-v2-
      - name: Build tools
        run: brew install -q bison ccache cmake diffutils make meson ninja ruby
      - name: Build mkxp-z
        run: |
          export PATH="$(brew --prefix bison)/bin:$(brew --prefix ruby)/bin:$PATH"
          ccache --set-config=max_size=2G
          bash scripts/build-mkxp-ios.sh 2>&1 | tee build-mkxp-ios.log
      - name: Keep compiled objects and downloads
        if: always()
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            .ccache
            build/mkxp-ios/mkxp-z/subprojects/packagecache
          key: mkxp-ios-v2-${{ github.run_id }}
      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: mkxp-ios-logs
          path: |
            build-mkxp-ios.log
            build/mkxp-ios/build/meson-logs/
          retention-days: 14
