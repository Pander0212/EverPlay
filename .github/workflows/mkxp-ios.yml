name: mkxp-z for iPhone (RPG Maker XP/VX/VX Ace)
# Builds mkxp-z and its libraries for iPhone with scripts/build-mkxp-ios.sh. Compiled objects
# are kept in a ccache, so a run after a fix only rebuilds what changed.
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/mkxp-ios.yml
      - scripts/build-mkxp-ios.sh
      - scripts/patch-mkxp-ios.py
      - scripts/package-mkxp-framework.py
permissions:
  contents: read
concurrency:
  group: mkxp-ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-26
    permissions:
      contents: write  # the libretro-cores release, which the all-in-one build pins
    timeout-minutes: 150
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      CCACHE_DIR: ${{ github.workspace }}/.ccache
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Reuse compiled objects and downloads
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            .ccache
            build/mkxp-ios/mkxp-z/subprojects/packagecache
          key: mkxp-ios-v2-${{ github.run_id }}
          restore-keys: mkxp-ios-v2-
      - name: Build tools
        run: brew install -q bison ccache cmake diffutils make meson ninja ruby
      - name: Build mkxp-z
        run: |
          set -o pipefail
          export PATH="$(brew --prefix bison)/bin:$(brew --prefix ruby)/bin:$PATH"
          ccache --set-config=max_size=2G
          bash scripts/build-mkxp-ios.sh 2>&1 | tee build-mkxp-ios.log
      - name: Link MKXP.framework
        run: |
          set -o pipefail
          python3 scripts/package-mkxp-framework.py build/mkxp-output > package-mkxp.log 2>&1 \
            || { grep -E ' error:|FAILED:|Undefined symbols|ld: ' package-mkxp.log | head -n 80; exit 1; }
          ls -la build/mkxp-output/Frameworks/MKXP.framework
          (cd build/mkxp-output && zip -qry ../../MKXP.framework.zip Frameworks)
      - name: Publish the framework for the all-in-one build
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          name="mkxp-z_ios-arm64-$(git rev-parse --short HEAD).framework.zip"
          cp MKXP.framework.zip "$name"
          gh release upload libretro-cores --repo "$GITHUB_REPOSITORY" --clobber "$name"
          echo "Pin in allinone.yml: $name $(shasum -a 256 "$name" | cut -d' ' -f1)"
      - name: Keep the framework
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: mkxp-framework
          path: MKXP.framework.zip
          retention-days: 14
      - name: Keep compiled objects and downloads
        if: always()
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            .ccache
            build/mkxp-ios/mkxp-z/subprojects/packagecache
          key: mkxp-ios-v2-${{ github.run_id }}
      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: mkxp-ios-logs
          path: |
            build-mkxp-ios.log
            package-mkxp.log
            build/mkxp-ios/build/meson-logs/
            build/mkxp-ios/build/subprojects/ruby-3_1_3/build/ext/zlib/mkmf.log
          retention-days: 14
